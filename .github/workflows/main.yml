name: Azure Function CI/CD
on:
  push:
    branches:
     - master

jobs:
  # BUILD JOB
  build:  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build FunctionApp1/FunctionApp1.csproj --configuration Release --no-restore

      - name: Publish Function App
        run: dotnet publish FunctionApp1/FunctionApp1.csproj -c Release -o publish 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          path: ./publish


  #  JOB 2 — DEPLOY
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp
          path: .

      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: kusumafunctionapp
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP }}
